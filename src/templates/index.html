<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
</head>
<body>
    <h1>URL Shortener</h1>

    <form action="/shorten" method="POST">
        <input type="url" name="url" placeholder="https://example.com" required>
        <button type="submit">Shorten</button>
    </form>

    {% if short_url %}
        <p>Your short link: <a href="{{ short_url }}">{{ short_url }}</a></p>
    {% endif %}
</body>
</html>
